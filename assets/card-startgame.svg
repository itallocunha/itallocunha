<svg xmlns="http://www.w3.org/2000/svg" width="590" height="250" viewBox="0 0 590 250">
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f4a3a"/><stop offset="1" stop-color="#0b0716"/></linearGradient>
<pattern id="d" width="14" height="14" patternUnits="userSpaceOnUse"><rect width="2" height="2" fill="#7dffb0" opacity=".18"/></pattern></defs>
<style>
.t{font-family:'Courier New',Consolas,monospace;font-size:27px;font-weight:900;letter-spacing:2px;fill:#7dffb0}
.s{font-family:'Courier New',Consolas,monospace;font-size:14px;fill:#fff;letter-spacing:1px;font-weight:700}
.ds{font-family:'Courier New',Consolas,monospace;font-size:14px;fill:#cdbfee}
.tg{font-family:'Courier New',Consolas,monospace;font-size:11px;font-weight:700;letter-spacing:1px}
.go{font-family:'Courier New',Consolas,monospace;font-size:13px;fill:#7dffb0;font-weight:700;letter-spacing:2px;animation:go 1.6s ease-in-out infinite}
@keyframes go{50%{transform:translateX(6px)}}
.sh{animation:sh 4.5s ease-in-out infinite}@keyframes sh{0%{transform:translateX(-200px)}60%,100%{transform:translateX(790px)}}
.bd{animation:bd 3s ease-in-out infinite}@keyframes bd{50%{stroke-opacity:.35}}
</style>
<clipPath id="cl"><rect width="590" height="250" rx="14"/></clipPath>
<g clip-path="url(#cl)">
<rect width="590" height="250" fill="url(#g)"/><rect width="590" height="250" fill="url(#d)"/>
<polygon class="sh" points="0,0 40,0 10,250 -30,250" fill="#fff" opacity=".07"/>
<rect x="24" y="22" width="46" height="6" fill="#7dffb0"/>
<text class="t" x="24" y="62">START GAME</text>
<text class="s" x="24" y="90">Oficina e game jam em escola pública</text>
<text class="ds" x="24" y="120">Extensão da UNIVALI: ensinar a criar jogos para</text><text class="ds" x="24" y="142">alunos em Balneário Camboriú.</text><rect x="24" y="196" width="94" height="24" fill="#7dffb0" fill-opacity=".14" stroke="#7dffb0" stroke-opacity=".6"/><text class="tg" x="71.0" y="213" text-anchor="middle" fill="#7dffb0">EDUCAÇÃO</text><rect x="128" y="196" width="94" height="24" fill="#7dffb0" fill-opacity=".14" stroke="#7dffb0" stroke-opacity=".6"/><text class="tg" x="175.0" y="213" text-anchor="middle" fill="#7dffb0">GAME JAM</text><rect x="232" y="196" width="94" height="24" fill="#7dffb0" fill-opacity=".14" stroke="#7dffb0" stroke-opacity=".6"/><text class="tg" x="279.0" y="213" text-anchor="middle" fill="#7dffb0">EXTENSÃO</text>
<text class="go" x="566" y="236" text-anchor="end">VER PROJETO ▸</text>
</g>
<rect class="bd" x="1.5" y="1.5" width="587" height="247" rx="14" fill="none" stroke="#7dffb0" stroke-width="2"/>
</svg>